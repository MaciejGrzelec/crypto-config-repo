server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5436/recommendation_db
    username: recommendation_user
    password: ${RECOMMENDATION_DB_PASSWORD}

eureka:
  instance:
    instance-id: "${spring.application.name}:${random.uuid}"
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

content:
  service:
    url: http://CONTENT-MS
