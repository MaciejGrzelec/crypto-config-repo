
spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/content_db
    username: content_user
    password: ${CONTENT_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

server:
  port: 8081

eureka:
  instance:
    instance-id: "${spring.application.name}:${random.uuid}"
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: content-ms
    description: Microservice for cryptocurrency content
    version: 1.0.0
